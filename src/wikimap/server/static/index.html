<!doctype html>
<!-- Mode switcher (Explore | Connect) + graph canvas + settings panel.

     The settings panel has three sections, and the split between them is the
     architecture, not just tidiness:

       Search  - owned by the SERVER (config.py). Values and bounds both come from
                 /api/config; nothing here hardcodes a number. These change what the
                 algorithm does, so they travel to the backend as query params.
       Display - owned by the BROWSER. Node size, arrows, colours. These never reach
                 the server: they change how the graph is drawn, and contract 2 says
                 the backend has no opinion about drawing. Persisted in localStorage.
       Forces  - also browser-owned. vis-network's force-directed physics.

     Rule of thumb: if it changes the SEARCH it lives in config.py; if it changes the
     PICTURE it lives here. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wikimap</title>
    <link rel="stylesheet" href="style.css" />
    <!-- vis-network from a CDN: the locked stack says "no build step", and a script
         tag is how you get a library without one. Needs internet on first load
         (so does Wikipedia, so this costs no extra capability). -->
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  </head>
  <body>
    <header>
      <h1>wikimap</h1>
      <!-- Centered via header's 3-column grid (style.css), independent of h1's and
           .mode's widths on either side. Explore has no backend yet — see CLAUDE.md's
           "finish Connect before starting Explore" — so its button ships disabled
           rather than wired to a mode that doesn't exist. Connect needs no click
           handler: it's the only real option, so it's simply always the active one. -->
      <div class="mode-toggle" role="tablist" aria-label="Mode">
        <button type="button" class="active" aria-pressed="true">Connect</button>
        <button type="button" disabled title="Not built yet" aria-pressed="false">Explore</button>
      </div>
      <span class="mode">Connect</span>
    </header>

    <form id="run-form">
      <!-- One flowing phrase instead of two stacked From/To fields. Each input still
           needs its own accessible name since it's no longer inside a <label> of its
           own — aria-label carries that instead of visible text. .input-wrap gives
           the suggestion list a positioned ancestor sized to the input alone (not the
           whole phrase) — see style.css. autocomplete="off" so the browser's own
           address-bar-style suggestions don't fight ours for the same box. -->
      <div class="connect-phrase">
        <span>Connect</span>
        <div class="input-wrap">
          <input
            id="seed"
            name="seed"
            value="Cat"
            required
            maxlength="200"
            autocomplete="off"
            aria-label="From page"
          />
          <ul id="seed-suggestions" class="suggestions" hidden></ul>
        </div>
        <span>and</span>
        <div class="input-wrap">
          <input
            id="target"
            name="target"
            value="Astronomy"
            required
            maxlength="200"
            autocomplete="off"
            aria-label="To page"
          />
          <ul id="target-suggestions" class="suggestions" hidden></ul>
        </div>
      </div>
      <button id="run" type="submit">Run</button>
      <button id="stop" type="button" disabled>Stop</button>
      <button id="toggle-panel" type="button" class="ghost">Settings</button>
    </form>

    <main>
      <!-- #canvas is the positioned wrapper; #graph, #panel, and #node-panel are
           SIBLINGS. They must never be nested: vis-network's Canvas._create() begins
           with
             for (; container.hasChildNodes(); ) container.removeChild(firstChild)
           so anything inside #graph is deleted the moment the Network is built.
           Putting the settings panel in there once already wiped it and killed
           app.js — the same trap applies to any new panel added here. -->
      <div id="canvas">
        <div id="graph"></div>
        <div id="panel">
          <details open>
            <summary>Search</summary>
            <p class="hint">Sent to the server. Changes what the algorithm does.</p>
            <!-- Inputs ship with no value/min/max and disabled on purpose: app.js
                 fills them from /api/config so the browser never holds its own copy
                 of a number that lives in config.py (contract 1). -->
            <label>
              <span>top-K</span>
              <input id="top_k" name="top_k" type="number" disabled />
              <small id="top_k-range"></small>
            </label>
            <label>
              <span>max depth</span>
              <input id="max_depth" name="max_depth" type="number" disabled />
              <small id="max_depth-range"></small>
            </label>
            <button id="reset-knobs" type="button" disabled>Reset search knobs</button>
          </details>

          <details open>
            <summary>Display</summary>
            <p class="hint">Browser only. Never sent anywhere.</p>
            <label class="row">
              <span>Auto-fit view</span>
              <!-- Escape hatch, same pattern as Physics below: keeps the camera
                   zoomed to fit the whole graph as it grows. Uncheck to take manual
                   control of pan/zoom without the view yanking back on the next tick. -->
              <input id="d-autoFit" type="checkbox" data-display checked />
            </label>
            <label>
              <span>Text fade threshold</span>
              <input id="d-labelZoom" type="range" data-display min="0" max="2" step="0.05" value="0.4" />
            </label>
            <label>
              <span>Node size (base)</span>
              <input id="d-nodeSize" type="range" data-display min="4" max="40" step="1" value="12" />
            </label>
            <label class="row">
              <span>Size by</span>
              <!-- Mirrors "Colour by" below: same score/depth fields already sitting
                   on every node, this time scaling the base slider above per node
                   instead of applying it uniformly. "uniform" reproduces the old
                   one-slider-fits-all behaviour exactly. Seed/target are deliberately
                   EXEMPT from this (see the isSeed||isTarget branch in app.js) -- they
                   always render at a fixed size so the two fixed points of the search
                   stay visually obvious no matter which mode is picked here. -->
              <select id="d-sizeBy" data-display title="'similarity' means similarity-to-target on nodes found searching forward from the seed, but similarity-to-seed on nodes found searching backward from the target -- colour by 'side (fwd/bwd)' to see which half a node is on.">
                <option value="uniform">uniform</option>
                <option value="score">similarity</option>
                <option value="depth">depth</option>
              </select>
            </label>
            <label>
              <span>Link thickness</span>
              <input id="d-linkWidth" type="range" data-display min="0.2" max="5" step="0.1" value="1" />
            </label>
            <label class="row">
              <span>Colour by</span>
              <!-- score/depth are only possible because Steps carry real data: every
                   node knows its cosine score AND its depth from the seed. side and
                   recency are derived client-side (side: sign of depth: which of
                   default.py's forward/backward frontiers found this node; recency:
                   the tick it was first discovered in, tracked in app.js). band is
                   score again, bucketed into 4 named ranges instead of a gradient. -->
              <select id="d-colorBy" data-display title="'similarity' means similarity-to-target on nodes found searching forward from the seed, but similarity-to-seed on nodes found searching backward from the target -- 'side (fwd/bwd)' shows which half a node is on.">
                <option value="score">similarity (gradient)</option>
                <option value="band">similarity (bands)</option>
                <option value="depth">depth</option>
                <option value="side">side (fwd/bwd)</option>
                <option value="recency">discovery order</option>
              </select>
            </label>
            <label class="row">
              <span>Dim off-path</span>
              <!-- Independent of "Colour by" above: once a route is found, mutes
                   everything NOT on it instead of picking a different scheme. -->
              <input id="d-dimOffPath" type="checkbox" data-display />
            </label>
            <button id="replay" type="button" disabled>Replay build</button>
          </details>

          <details>
            <summary>Forces</summary>
            <p class="hint">vis-network physics. Applied live.</p>
            <label class="row">
              <span>Physics</span>
              <!-- Escape hatch: force-directed layout on hundreds of nodes can get
                   janky. Turning it off freezes positions and costs nothing. -->
              <input id="d-physics" type="checkbox" data-display checked />
            </label>
            <label>
              <span>Center force</span>
              <!-- 2026-08-02, fifth pass, done properly this time: previous cycles
                   patched one variable at a time (curve shape, then floor, then
                   ceiling, then a full lock to default) without ever mapping the whole
                   stable envelope in one measurement. This pass swept centralGravity
                   0.30/0.35/0.40/0.45 against TWO graph instances (a fresh ~81-node
                   Cat->Astronomy run and a second run of the same pair forced through
                   a deeper max_depth ceiling -- confirmed structurally identical, n=81
                   both times, since default.py stops at the real meeting point
                   regardless of the ceiling, but it's an independent re-run/re-settle,
                   not a cached repeat), sampling network.getPositions() every 150ms
                   with 2 repeated trials per value to catch flakiness, not just a
                   single lucky settle. Result: 0.30/0.35/0.40 settled to 0px/frame
                   drift on every trial on both runs; 0.45 settled clean on 3 of 4
                   trials but produced a real 3-8px/frame non-decaying drift on the
                   4th -- confirming the instability boundary sits between 0.40 and
                   0.45, consistent with the earlier binary search (flaky from ~0.456).
                   data-log-max is set to 0.35, not 0.40 -- 0.40 tested clean here too,
                   but it was the number already shipped when the user reported this
                   still felt broken last round, so it gets no benefit of the doubt;
                   0.35 buys a full extra step of margin below the confirmed-flaky
                   value with zero flakes across every trial run against it.
                   data-log-min stays 0.005, re-confirmed on both graph instances
                   (labels stayed visible even down to 0.003 on both, so 0.005 keeps
                   its existing safety margin, not just "worked before").
                   Per-step scaling is no longer a guess either: re-swept the real
                   shipped file end to end at 10-unit steps and measured radius drop
                   directly -- a flat 14.9-19.9% drop every single step, 0.005 through
                   0.35, matching the ^-0.5 power-law fit from the original 11-point
                   sweep at the old 0.005-0.5 bounds almost exactly. No dead zones,
                   no runaway zone. Default raw recalculated 100->16 to keep resolving
                   to the same semantic default, centralGravity≈0.0099 -- the slider
                   moves in BOTH directions from default again, not locked to one edge.

                   One false alarm caught and corrected IN this same measurement pass,
                   worth recording because it looks identical to a real bug at a
                   glance: a repeated-trial check at the new top edge (raw=100)
                   flaked once in 4 tries at a 2.5s settle window, which looked exactly
                   like the earlier real cg=0.5 instability finding. Before shipping
                   0.35 anyway, re-ran that exact flaky transition 6 times watching a
                   full 12 SECONDS straight instead of 2.5: every single trial decayed
                   smoothly and completely to 0px/frame movement, just some taking
                   ~3.5s instead of ~2.5s -- an ordinary damped settle after a sudden
                   parameter jump (peaks briefly over 100px/frame, then decays
                   monotonically to exactly zero), not oscillation. That's categorically
                   different from the confirmed real instability at cg~=0.5, which
                   stayed at 2.6-11.9px/frame with NO decay trend even 9 seconds in.
                   Lesson: an "unsettled" reading only means something if the
                   observation window is long enough to rule out a slow-but-normal
                   settle -- 2-3s was not, for this graph size; 12s reliably is. -->
              <input
                id="d-centralGravity"
                type="range"
                data-display
                data-log
                data-log-min="0.005"
                data-log-max="0.35"
                min="0"
                max="100"
                step="1"
                value="16"
              />
            </label>
            <label>
              <span>Repel force</span>
              <!-- Slider is the MAGNITUDE; vis-network wants it negative, so app.js
                   negates. A slider that goes right for "more repel" is the sane UI.
                   Default raised 45->70 (2026-08-02 measurement pass): higher repel
                   consistently improved label spacing at every graph size tested with
                   no stability cost — see HISTORY. -->
              <input id="d-repel" type="range" data-display min="0" max="250" step="5" value="70" />
            </label>
            <label>
              <span>Link force</span>
              <input id="d-springConstant" type="range" data-display min="0" max="0.4" step="0.005" value="0.08" />
            </label>
            <label>
              <span>Link distance</span>
              <!-- Max capped 400->180 (2026-08-02 measurement pass): above ~200 the
                   layout never settles once a graph reaches ~80 nodes (a fixed run of
                   default.py's typical size) — a Playwright probe measured 20-30px/sec
                   of continuing drift long after physics should have damped out, and
                   the graph visibly flies apart instead of organizing. See HISTORY. -->
              <input id="d-springLength" type="range" data-display min="20" max="180" step="5" value="110" />
            </label>
            <button id="reset-display" type="button">Reset display</button>
          </details>
        </div>
        <!-- Opens on clicking any node, any time (mid-run or after). Empty text
             nodes on load; app.js fills them via textContent only, never innerHTML —
             a page summary is real Wikipedia text landing in the DOM verbatim, same
             rule as #log. -->
        <div id="node-panel" class="hidden">
          <div class="node-panel-head">
            <strong id="node-panel-title"></strong>
            <button id="node-panel-close" type="button" aria-label="Close">×</button>
          </div>
          <p id="node-panel-meta" class="hint"></p>
          <p id="node-panel-summary"></p>
          <a id="node-panel-link" class="hidden" href="#" target="_blank" rel="noopener noreferrer">Open on Wikipedia ↗</a>
        </div>
        <!-- Shown only once step.path lands (the terminal success Step, contracts.py)
             -- reuses that Step's own note text rather than composing a second phrasing
             of "reached target in N hops", so the banner can never drift out of sync
             with what the log already says. Hidden again by resetLog() at the next
             run/replay. Sibling of #graph, same nesting rule as #panel/#node-panel. -->
        <div id="found-banner" class="hidden" role="status">
          <span class="found-banner-icon" aria-hidden="true"></span>
          <span id="found-banner-label"></span>
          <button id="found-banner-close" type="button" aria-label="Dismiss">×</button>
        </div>
      </div>
      <aside id="log" aria-live="polite"></aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
