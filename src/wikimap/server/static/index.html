<!doctype html>
<!-- Mode switcher (Explore | Connect) + graph canvas + settings panel.

     The settings panel has three sections, and the split between them is the
     architecture, not just tidiness:

       Search  - owned by the SERVER (config.py). Values and bounds both come from
                 /api/config; nothing here hardcodes a number. These change what the
                 algorithm does, so they travel to the backend as query params.
       Display - owned by the BROWSER. Node size, arrows, colours. These never reach
                 the server: they change how the graph is drawn, and contract 2 says
                 the backend has no opinion about drawing. Persisted in localStorage.
       Forces  - also browser-owned. vis-network's force-directed physics.

     Rule of thumb: if it changes the SEARCH it lives in config.py; if it changes the
     PICTURE it lives here. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wikimap</title>
    <link rel="stylesheet" href="style.css" />
    <!-- vis-network from a CDN: the locked stack says "no build step", and a script
         tag is how you get a library without one. Needs internet on first load
         (so does Wikipedia, so this costs no extra capability). -->
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  </head>
  <body>
    <header>
      <h1>wikimap</h1>
      <!-- Centered via header's 3-column grid (style.css), independent of h1's and
           .mode's widths on either side. Explore has no backend yet — see CLAUDE.md's
           "finish Connect before starting Explore" — so its button ships disabled
           rather than wired to a mode that doesn't exist. Connect needs no click
           handler: it's the only real option, so it's simply always the active one. -->
      <div class="mode-toggle" role="tablist" aria-label="Mode">
        <button type="button" class="active" aria-pressed="true">Connect</button>
        <button type="button" disabled title="Not built yet" aria-pressed="false">Explore</button>
      </div>
      <span class="mode">Connect — greedy</span>
    </header>

    <form id="run-form">
      <label>
        From
        <!-- .input-wrap gives the suggestion list a positioned ancestor sized to
             the input alone (not the whole label, which also contains "From"/"To"
             text) — see style.css. autocomplete="off" so the browser's own
             address-bar-style suggestions don't fight ours for the same box. -->
        <div class="input-wrap">
          <input id="seed" name="seed" value="Cat" required maxlength="200" autocomplete="off" />
          <ul id="seed-suggestions" class="suggestions" hidden></ul>
        </div>
      </label>
      <label>
        To
        <div class="input-wrap">
          <input id="target" name="target" value="Astronomy" required maxlength="200" autocomplete="off" />
          <ul id="target-suggestions" class="suggestions" hidden></ul>
        </div>
      </label>
      <label>
        Algorithm
        <!-- Options are filled in from /api/config's registry, not listed here, so
             adding an algorithm server-side needs no frontend change. -->
        <select id="algorithm" name="algorithm" disabled></select>
      </label>
      <button id="run" type="submit">Run</button>
      <button id="stop" type="button" disabled>Stop</button>
      <button id="toggle-panel" type="button" class="ghost">Settings</button>
    </form>

    <main>
      <!-- #canvas is the positioned wrapper; #graph, #panel, and #node-panel are
           SIBLINGS. They must never be nested: vis-network's Canvas._create() begins
           with
             for (; container.hasChildNodes(); ) container.removeChild(firstChild)
           so anything inside #graph is deleted the moment the Network is built.
           Putting the settings panel in there once already wiped it and killed
           app.js — the same trap applies to any new panel added here. -->
      <div id="canvas">
        <div id="graph"></div>
        <div id="panel">
          <details open>
            <summary>Search</summary>
            <p class="hint">Sent to the server. Changes what the algorithm does.</p>
            <!-- Inputs ship with no value/min/max and disabled on purpose: app.js
                 fills them from /api/config so the browser never holds its own copy
                 of a number that lives in config.py (contract 1). -->
            <label>
              <span>top-K</span>
              <input id="top_k" name="top_k" type="number" disabled />
              <small id="top_k-range"></small>
            </label>
            <label>
              <span>max depth</span>
              <input id="max_depth" name="max_depth" type="number" disabled />
              <small id="max_depth-range"></small>
            </label>
            <!-- bfs-only (see config.py, 2026-07-30): the other three algorithms cap
                 each node's fan-out to top-K already, so max_depth * top-K already
                 bounds them and this cap is redundant there. bfs has no such per-node
                 cap by design (it's the uncapped ground truth), so this is its
                 backstop against a single huge-fanout page (a TV-show hub, say)
                 expanding forever. -->
            <label class="nodecap">
              <span>max nodes</span>
              <input id="max_nodes" name="max_nodes" type="number" disabled />
              <small id="max_nodes-range"></small>
            </label>
            <!-- Used by astar AND default (bidirectional A* — see default.py); dimmed
                 for greedy/bfs, which ignore both. W=0 orders purely by hops
                 (breadth-first); W very large ignores hops (greedy). -->
            <label class="weighted">
              <span>weight W</span>
              <input id="heuristic_weight" name="heuristic_weight" type="number" step="0.5" disabled />
              <small id="heuristic_weight-range"></small>
            </label>
            <!-- Converts cosine into hops so g and h share a unit — see astar.py. -->
            <label class="weighted">
              <span>hop scale</span>
              <input id="hop_scale" name="hop_scale" type="number" step="0.5" disabled />
              <small id="hop_scale-range"></small>
            </label>
            <button id="reset-knobs" type="button" disabled>Reset search knobs</button>
          </details>

          <details open>
            <summary>Display</summary>
            <p class="hint">Browser only. Never sent anywhere.</p>
            <label class="row">
              <span>Arrows</span>
              <input id="d-arrows" type="checkbox" data-display checked />
            </label>
            <label class="row">
              <span>Auto-fit view</span>
              <!-- Escape hatch, same pattern as Physics below: keeps the camera
                   zoomed to fit the whole graph as it grows. Uncheck to take manual
                   control of pan/zoom without the view yanking back on the next tick. -->
              <input id="d-autoFit" type="checkbox" data-display checked />
            </label>
            <label>
              <span>Text fade threshold</span>
              <input id="d-labelZoom" type="range" data-display min="0" max="2" step="0.05" value="0.4" />
            </label>
            <label>
              <span>Node size (base)</span>
              <input id="d-nodeSize" type="range" data-display min="4" max="40" step="1" value="12" />
            </label>
            <label class="row">
              <span>Size by</span>
              <!-- Mirrors "Colour by" below: same score/depth fields already sitting
                   on every node, this time scaling the base slider above per node
                   instead of applying it uniformly. "uniform" reproduces the old
                   one-slider-fits-all behaviour exactly. -->
              <select id="d-sizeBy" data-display>
                <option value="uniform">uniform</option>
                <option value="score">similarity</option>
                <option value="depth">depth</option>
              </select>
            </label>
            <label>
              <span>Link thickness</span>
              <input id="d-linkWidth" type="range" data-display min="0.2" max="5" step="0.1" value="1" />
            </label>
            <label class="row">
              <span>Colour by</span>
              <!-- Only possible because Steps carry real data: every node knows its
                   cosine score AND its depth from the seed. -->
              <select id="d-colorBy" data-display>
                <option value="score">similarity</option>
                <option value="depth">depth</option>
              </select>
            </label>
            <button id="replay" type="button" disabled>Replay build</button>
          </details>

          <details>
            <summary>Forces</summary>
            <p class="hint">vis-network physics. Applied live.</p>
            <label class="row">
              <span>Physics</span>
              <!-- Escape hatch: force-directed layout on hundreds of nodes can get
                   janky. Turning it off freezes positions and costs nothing. -->
              <input id="d-physics" type="checkbox" data-display checked />
            </label>
            <label>
              <span>Center force</span>
              <input id="d-centralGravity" type="range" data-display min="0" max="0.5" step="0.005" value="0.01" />
            </label>
            <label>
              <span>Repel force</span>
              <!-- Slider is the MAGNITUDE; vis-network wants it negative, so app.js
                   negates. A slider that goes right for "more repel" is the sane UI. -->
              <input id="d-repel" type="range" data-display min="0" max="250" step="5" value="45" />
            </label>
            <label>
              <span>Link force</span>
              <input id="d-springConstant" type="range" data-display min="0" max="0.4" step="0.005" value="0.08" />
            </label>
            <label>
              <span>Link distance</span>
              <input id="d-springLength" type="range" data-display min="20" max="400" step="5" value="110" />
            </label>
            <button id="reset-display" type="button">Reset display</button>
          </details>
        </div>
        <!-- Opens on clicking any node, any time (mid-run or after). Empty text
             nodes on load; app.js fills them via textContent only, never innerHTML —
             a page summary is real Wikipedia text landing in the DOM verbatim, same
             rule as #log. -->
        <div id="node-panel" class="hidden">
          <div class="node-panel-head">
            <strong id="node-panel-title"></strong>
            <button id="node-panel-close" type="button" aria-label="Close">×</button>
          </div>
          <p id="node-panel-meta" class="hint"></p>
          <p id="node-panel-summary"></p>
          <a id="node-panel-link" class="hidden" href="#" target="_blank" rel="noopener noreferrer">Open on Wikipedia ↗</a>
        </div>
      </div>
      <aside id="log" aria-live="polite"></aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
