<!doctype html>
<!-- Mode switcher (Explore | Connect) + graph canvas + settings panel.
     Settings panel is generated from config so knobs stay in one place.
     Step 6: Connect only, knobs are now live controls. Their VALUES and their
     min/max both come from /api/config — nothing here hardcodes a number, so
     changing config.py moves the sliders without touching this file. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wikimap</title>
    <link rel="stylesheet" href="style.css" />
    <!-- vis-network from a CDN: the locked stack says "no build step", and a script
         tag is how you get a library without one. Needs internet on first load
         (so does Wikipedia, so this costs no extra capability). -->
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  </head>
  <body>
    <header>
      <h1>wikimap</h1>
      <span class="mode">Connect — greedy</span>
    </header>

    <form id="run-form">
      <label>
        From
        <input id="seed" name="seed" value="Cat" required maxlength="200" />
      </label>
      <label>
        To
        <input id="target" name="target" value="Astronomy" required maxlength="200" />
      </label>
      <button id="run" type="submit">Run</button>
      <button id="stop" type="button" disabled>Stop</button>
    </form>

    <!-- Settings. Empty on purpose: app.js fills in value/min/max from /api/config
         so the browser never holds its own copy of a knob (contract 1). -->
    <form id="settings">
      <label>
        top-K
        <input id="top_k" name="top_k" type="number" disabled />
        <small id="top_k-range"></small>
      </label>
      <label>
        max depth
        <input id="max_depth" name="max_depth" type="number" disabled />
        <small id="max_depth-range"></small>
      </label>
      <label>
        max nodes
        <input id="max_nodes" name="max_nodes" type="number" disabled />
        <small id="max_nodes-range"></small>
      </label>
      <button id="reset-knobs" type="button" disabled>Reset</button>
    </form>

    <main>
      <div id="graph"></div>
      <aside id="log" aria-live="polite"></aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
